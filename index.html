<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cedar & Clove Wellness</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: 'Montserrat', sans-serif; 
            line-height: 1.6; 
            color: #2c302c; 
            background-color: #efeae6; 
        }
        
        /* HEADER BLOCK */
        .brand-header-block {
            background-color: #efeae6;
            text-align: center;
            padding: 40px 20px 30px 20px;
        }

        .brand-logo {
            display: block;
            max-width: 250px; 
            width: 100%;
            height: auto;
            margin: 0 auto 15px auto;
        }

        .business-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8rem;
            font-weight: 400;
            color: #4a1c19; 
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }

        /* NAVIGATION BAR */
        nav { 
            background: #ffffff; 
            padding: 18px 20px; 
            text-align: center; 
            border-top: 1px solid #dcd5cf;
            border-bottom: 1px solid #dcd5cf; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }
        nav a { 
            margin: 0 15px; 
            text-decoration: none; 
            color: #4a504a; 
            font-weight: 600; 
            text-transform: uppercase; 
            font-size: 0.8rem; 
            letter-spacing: 1.5px; 
        }
        nav a:hover { color: #a35c58; }

        /* Page Layout Containers */
        .container { max-width: 800px; margin: 50px auto; padding: 0 20px; }
        section { margin-bottom: 70px; scroll-margin-top: 120px; }
        
        h2 { 
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.2rem;
            color: #161a16; 
            margin-bottom: 10px;
            font-weight: 400; 
            letter-spacing: 1px; 
            margin-top: 20px;
        }
        
        .section-subtitle {
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #a35c58;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .timing-note {
            font-style: italic;
            font-size: 0.9rem;
            color: #606660;
            margin-bottom: 30px;
            display: block;
        }

        /* About Section */
        .about-content { display: flex; gap: 40px; align-items: center; flex-wrap: wrap; }
        .about-text { flex: 1; min-width: 280px; font-size: 0.95rem; color: #444; }
        .about-img { width: 220px; height: 220px; border-radius: 50%; object-fit: cover; border: 4px solid #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.04); }

        /* Menu Grid Arrangements */
        .menu-grid { display: grid; grid-template-columns: 1fr; gap: 25px; margin-bottom: 50px; }
        .menu-card { background: #fff; border: 1px solid #e5ded8; border-radius: 12px; overflow: hidden; display: flex; flex-wrap: wrap; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        .menu-img { width: 180px; height: auto; min-height: 180px; object-fit: cover; flex: 1; min-width: 150px; }
        .menu-info { padding: 25px; flex: 2; min-width: 280px; }
        
        .menu-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; gap: 10px; }
        .menu-title { font-family: 'Cormorant Garamond', serif; font-size: 1.4rem; font-weight: bold; color: #161a16; }
        .menu-price { font-weight: bold; color: #a35c58; font-size: 1.1rem; white-space: nowrap; }
        .menu-desc { font-size: 0.9rem; color: #606660; }
        .menu-upgrade { font-size: 0.85rem; color: #a35c58; font-style: italic; margin-top: 10px; font-weight: 600; }
        .menu-bullets { margin-top: 10px; padding-left: 20px; font-size: 0.85rem; color: #606660; }

        /* Booking block placeholder */
        .booking-widget { background: #fff; border: 1px solid #e5ded8; border-radius: 12px; padding: 40px; text-align: center; min-height: 400px; box-shadow: 0 4px 15px rgba(0,0,0,0.02); }
        
        footer { text-align: center; padding: 40px; font-size: 0.85em; color: #888; background: #fff; border-top: 1px solid #e5ded8; margin-top: 120px; }
    </style>
</head>
<body>

    <div class="brand-header-block">
        <img class="brand-logo" src="logo.png?v=200" alt="Cedar & Clove Wellness Logo">
        <h1 class="business-title">Cedar & Clove Wellness</h1>
    </div>

    <nav>
        <a href="#about">About</a>
        <a href="#menu">Treatments</a>
    </footer>

</body>
</html>
